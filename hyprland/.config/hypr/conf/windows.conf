##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}


# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}

# More Rules
# windowrulev2 = bordercolor rgb(ff5555), xwayland:1 # check if window is xwayland

# Float some windows
windowrule {
  name = windowrule-3
  float = on
  match:class = pavucontrol
}

windowrule {
  name = windowrule-4
  float = on
  match:class = pavucontrol-qt
}

windowrule {
  name = windowrule-5
  float = on
  match:class = blueman-manager
}

windowrule {
  name = windowrule-6
  float = on
  match:class = nm-connection-editor
}

windowrule {
  name = windowrule-7
  float = on
  match:class = open-folder
}


# Browser Picture in Picture
windowrule {
  name = windowrule-8
  float = on
  pin = on
  move = ((monitor_w*0.695)) ((monitor_h*0.04))
  match:title = Picture-in-Picture
}

# Open folder popups
windowrule {
  name = windowrule-10
  float = on
  match:title = Open Folder
  match:class = xdg-desktop-portal-gtk
}
windowrule {
  name = windowrule-11
  float = on
  match:title = Open Files
  match:class = xdg-desktop-portal-gtk
}
windowrule {
  name = windowrule-12
  float = on
  match:title = ^(File)$
  match:class = xdg-desktop-portal-gtk
}
windowrule {
  name = windowrule-13
  float = on
  match:title = ^(Folder)$
  match:class = xdg-desktop-portal-gtk
}
windowrule {
  name = windowrule-14
  float = on
  match:title = ^(file)$
  match:class = xdg-desktop-portal-gtk
}
windowrule {
  name = windowrule-15
  float = on
  match:title = ^(folder)$
  match:class = xdg-desktop-portal-gtk
}

# Libreoffice no maximize
windowrule {
  name = windowrule-16
  suppress_event = maximize
  match:class = ^(libreoffice.*)$
}

# feh
windowrule {
  name = windowrule-17
  float = on
  match:class = feh
}



