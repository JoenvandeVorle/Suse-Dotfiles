## enable splash text rendering over the wallpaper
splash = true  # default is false

ipc = true  # default is true, enables IPC server

wallpaper {
    monitor = eDP-1
    path = $HOME/.local/share/wallpapers/
    fit_mode = cover
    timeout = 600
}

wallpaper {
    monitor = # fallback
    path = $HOME/.local/share/wallpapers/dusk_bridge.jpg
    fit_mode = cover
}